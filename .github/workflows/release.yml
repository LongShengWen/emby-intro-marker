name: Build and Release IntroMarkerPlugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build IntroMarkerPlugin.csproj -c Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntroMarkerPlugin
          path: bin/Release/net8.0/IntroMarkerPlugin.dll

      - name: Pack release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp bin/Release/net8.0/IntroMarkerPlugin.dll release/
          cd release
          zip -r IntroMarkerPlugin-${{ github.ref_name }}.zip IntroMarkerPlugin.dll

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IntroMarkerPlugin.dll
            release/IntroMarkerPlugin-${{ github.ref_name }}.zip
          generate_release_notes: true
